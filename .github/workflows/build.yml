# Builds libghostty-vt alone from a Ghostty release and publishes it as a
# release of this repository. Pushing a tag vX.Y.Z builds Ghostty's tag
# vX.Y.Z; a rebuild of the same version is vX.Y.Z-rN. macOS and Windows
# build on their own runners: on macOS Ghostty's libsystem_override.sh runs,
# so the static archive links with Apple's ld, and Windows can target MSVC.
# Linux cross-compiles the Windows GNU build, as Ghostty's own CI does. Zig
# comes from mlugg/setup-zig, which downloads from the community mirrors:
# ziglang.org refuses CI downloads (410).
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ghostty_ref:
        description: Ghostty tag to build (no release is published)
        required: true
        default: v1.4.0

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0
  GHOSTTY_REPOSITORY: https://github.com/ghostty-org/ghostty.git

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-macos
          - runner: macos-latest
            target: x86_64-macos
          - runner: windows-latest
            target: x86_64-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-windows-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Choose the Ghostty tag
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            ref='${{ inputs.ghostty_ref }}'
          else
            ref="${GITHUB_REF_NAME%%-r*}"
          fi
          echo "GHOSTTY_REF=$ref" >> "$GITHUB_ENV"

      - name: Clone Ghostty
        run: |
          git clone --depth 1 --branch "$GHOSTTY_REF" "$GHOSTTY_REPOSITORY" ghostty
          echo "GHOSTTY_COMMIT=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        working-directory: ghostty
        run: zig build -Demit-lib-vt -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package
        working-directory: ghostty
        run: |
          set -eu
          name="libghostty-vt-$GHOSTTY_REF-${{ matrix.target }}"
          mkdir -p "../dist/$name"
          cp -R zig-out/lib zig-out/include "../dist/$name/"
          if [ -d zig-out/bin ]; then cp -R zig-out/bin "../dist/$name/"; fi
          cp LICENSE "../dist/$name/"
          printf 'ghostty %s\ncommit %s\nzig %s\ntarget %s\nrunner %s\noptimize ReleaseFast\n' \
            "$GHOSTTY_REF" "$GHOSTTY_COMMIT" "$ZIG_VERSION" "${{ matrix.target }}" "${{ matrix.runner }}" \
            > "../dist/$name/BUILD-INFO"
          tar -czf "../dist/$name.tar.gz" -C ../dist "$name"

      # The static archive must link with the platform's own linker, not
      # only with Zig's: a cross-built macOS archive fails here with a
      # duplicate _memset.
      - name: Link a C program against the static library (macOS)
        if: runner.os == 'macOS'
        working-directory: ghostty
        run: |
          set -eu
          cat > link-check.c <<'EOF'
          #include <ghostty/vt.h>
          #include <string.h>
          int main(void) {
              GhosttyTerminal terminal = NULL;
              if (ghostty_terminal_new(NULL, &terminal, 80, 24) != GHOSTTY_SUCCESS) return 1;
              const char *text = "hello \x1b[31mred\x1b[0m\r\n";
              ghostty_terminal_vt_write(terminal, (const unsigned char *)text, strlen(text));
              if (ghostty_terminal_resize(terminal, 100, 30, 8, 16) != GHOSTTY_SUCCESS) return 1;
              ghostty_terminal_free(terminal);
              return 0;
          }
          EOF
          arch=$([ "${{ matrix.target }}" = aarch64-macos ] && echo arm64 || echo x86_64)
          clang -arch "$arch" -Izig-out/include link-check.c zig-out/lib/libghostty-vt.a -o link-check
          if [ "$arch" = "$(uname -m)" ]; then ./link-check; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ref="${GITHUB_REF_NAME%%-r*}"
          commit=$(git ls-remote "$GHOSTTY_REPOSITORY" "refs/tags/$ref^{}" | cut -f1)
          [ -n "$commit" ] || commit=$(git ls-remote "$GHOSTTY_REPOSITORY" "refs/tags/$ref" | cut -f1)
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "libghostty-vt from Ghostty $ref ($commit), Zig $ZIG_VERSION, ReleaseFast." \
            *.tar.gz SHA256SUMS
